<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gallery | Sultan Café, Richardson TX</title>
<meta name="description" content="Photos of the food, the grill and the hookah lounge at Sultan Café in Richardson, Texas.">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230b0a08'/%3E%3Cpath d='M32 6l7.5 9.5 11.5-2-2 11.5 9.5 7.5-9.5 7.5 2 11.5-11.5-2L32 58l-7.5-9.5-11.5 2 2-11.5L5.5 32l9.5-7.5-2-11.5 11.5 2z' fill='%23e2b553'/%3E%3Ccircle cx='32' cy='32' r='9' fill='%230b0a08'/%3E%3C/svg%3E">
<meta name="theme-color" content="#0b0a08">
<script>(function(){var t=null;try{t=localStorage.getItem("theme")}catch(e){}if(t==="light"||t==="dark")document.documentElement.setAttribute("data-theme",t);if(t?t==="dark":!matchMedia("(prefers-color-scheme: light)").matches)document.documentElement.classList.add("dark");})();</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Marcellus&family=Pinyon+Script&family=Urbanist:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<style>
  .filters { display: flex; justify-content: center; flex-wrap: wrap; gap: 8px; margin-bottom: 40px; }
  .filters button { font: 600 12.5px/1 var(--body); letter-spacing: .16em; text-transform: uppercase; color: var(--soft); background: none; border: 1px solid var(--line); padding: 11px 18px; border-radius: 999px; cursor: pointer; }
  .filters button[aria-pressed="true"] { background: var(--gold); color: var(--btn-fg); border-color: transparent; }
  .masonry { columns: 3 300px; column-gap: 18px; }
  .shot { break-inside: avoid; margin-bottom: 18px; border-radius: 20px; overflow: hidden; cursor: zoom-in; position: relative; border: 1px solid var(--line); background: var(--panel); display: block; width: 100%; padding: 0; }
  .shot img { width: 100%; height: auto; transition: transform .8s cubic-bezier(.2,.7,.2,1); }
  .shot:hover img { transform: scale(1.05); }
  .shot figcaption { position: absolute; left: 12px; bottom: 12px; font: 600 12px/1 var(--body); letter-spacing: .14em; text-transform: uppercase; color: #f4ead6; background: rgba(11,10,8,.65); backdrop-filter: blur(8px); padding: 8px 12px; border-radius: 999px; }

  /* Empty state: arched frames waiting for photos */
  .soon { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; }
  .frame { position: relative; aspect-ratio: .78; border-radius: 160px 160px 18px 18px; padding: 6px; background: var(--gold); opacity: .9; }
  .frame:nth-child(2) { transform: translateY(40px); }
  .frame > div { width: 100%; height: 100%; border-radius: 154px 154px 12px 12px; background: var(--panel); display: grid; place-items: center; text-align: center; padding: 20px; position: relative; overflow: hidden; }
  .frame .fade-lat { opacity: .8; }
  .frame span { position: relative; font: 400 22px/1.2 var(--display); color: var(--gold-text); }
  .soon-note { text-align: center; color: var(--soft); margin-top: 80px; }

  dialog.lb { border: 0; padding: 0; background: transparent; max-width: min(1100px, 94vw); max-height: 92vh; margin: auto; overflow: visible; }
  dialog.lb::backdrop { background: rgba(5, 4, 3, .9); backdrop-filter: blur(6px); }
  dialog.lb img { max-height: 86vh; width: auto; border-radius: 16px; border: 1px solid rgba(226,181,83,.4); margin: 0 auto; }
  dialog.lb .x, dialog.lb .nv { position: absolute; border: 0; cursor: pointer; background: #e2b553; color: #1a1205; border-radius: 50%; width: 44px; height: 44px; font: 700 20px/1 var(--body); display: grid; place-items: center; }
  dialog.lb .x { top: -18px; right: -18px; }
  dialog.lb .nv { top: 50%; margin-top: -22px; }
  dialog.lb .prev { left: -22px; } dialog.lb .next { right: -22px; }
  @media (max-width: 760px) { .soon { grid-template-columns: 1fr 1fr; } .frame:nth-child(3) { display: none; } .frame:nth-child(2) { transform: none; } }
</style>
</head>
<body data-page="gallery">
<div id="site-header"></div>

<main>
  <div class="page-hero">
    <div class="fade-lat lattice" aria-hidden="true"></div>
    <div class="wrap">
      <span class="script gold" style="font-size:48px;display:block" data-i18n="script">A feast for the eyes</span>
      <h1 data-i18n="title">Gallery</h1>
      <p data-i18n="lead">The grill, the plates and the lounge at Sultan Café.</p>
    </div>
  </div>

  <section>
    <div class="wrap">
      <div class="filters" id="filters" hidden></div>
      <div class="masonry" id="grid"></div>
      <div id="empty" hidden>
        <div class="soon" aria-hidden="true">
          <div class="frame"><div><div class="fade-lat lattice"></div><span data-i18n="f1">From the grill</span></div></div>
          <div class="frame"><div><div class="fade-lat lattice"></div><span data-i18n="f2">The lounge</span></div></div>
          <div class="frame"><div><div class="fade-lat lattice"></div><span data-i18n="f3">Sweet endings</span></div></div>
        </div>
        <p class="soon-note" data-i18n="soon">New photos are on their way. In the meantime, the food speaks for itself.</p>
        <div class="center" style="margin-top:22px"><a class="btn btn-gold" href="menu.html" data-i18n="soonBtn">See the menu</a></div>
      </div>
    </div>
  </section>
</main>

<dialog class="lb" id="lb">
  <img alt="">
  <button type="button" class="x" aria-label="Close">×</button>
  <button type="button" class="nv prev" aria-label="Previous photo">‹</button>
  <button type="button" class="nv next" aria-label="Next photo">›</button>
</dialog>

<div id="site-footer"></div>

<script>
  /* Add photos here: { src, alt, altEs, tag: "food" | "lounge" | "desserts" } */
  const GALLERY = [];
  const TAGS = { en: { all: "All", food: "Food", lounge: "Lounge", desserts: "Desserts" }, es: { all: "Todo", food: "Comida", lounge: "Lounge", desserts: "Postres" } };

  window.PAGE_ES = {
    __title: "Galería | Sultan Café, Richardson TX",
    __desc: "Fotos de la comida, la parrilla y el hookah lounge de Sultan Café en Richardson, Texas.",
    script: "Un festín para la vista", title: "Galería", lead: "La parrilla, los platillos y el lounge de Sultan Café.",
    f1: "De la parrilla", f2: "El lounge", f3: "Finales dulces",
    soon: "Pronto subiremos fotos nuevas. Mientras tanto, la comida habla por sí sola.", soonBtn: "Ver el menú"
  };
</script>
<script src="site.js"></script>
<script>
  (function () {
    const grid = document.getElementById("grid"), empty = document.getElementById("empty"), filters = document.getElementById("filters");
    const lb = document.getElementById("lb"), lbImg = lb.querySelector("img");
    let tag = "all", shown = [], idx = 0;

    function draw() {
      const l = window.SULTAN.lang();
      if (!GALLERY.length) { empty.hidden = false; grid.innerHTML = ""; filters.hidden = true; return; }
      const tags = ["all"].concat([...new Set(GALLERY.map(g => g.tag).filter(Boolean))]);
      filters.hidden = tags.length < 3;
      filters.innerHTML = tags.map(t => `<button type="button" data-tag="${t}" aria-pressed="${t === tag}">${TAGS[l][t] || t}</button>`).join("");
      shown = GALLERY.filter(g => tag === "all" || g.tag === tag);
      grid.innerHTML = shown.map((g, i) => `<button type="button" class="shot" data-i="${i}"><img src="${g.src}" alt="${(l === "es" && g.altEs) || g.alt || ""}" loading="lazy">${g.tag ? `<figcaption>${TAGS[l][g.tag] || g.tag}</figcaption>` : ""}</button>`).join("");
    }
    function open(i) { idx = (i + shown.length) % shown.length; const g = shown[idx]; lbImg.src = g.src; lbImg.alt = g.alt || ""; if (!lb.open) lb.showModal(); }
    filters.addEventListener("click", e => { const b = e.target.closest("[data-tag]"); if (b) { tag = b.dataset.tag; draw(); } });
    grid.addEventListener("click", e => { const b = e.target.closest(".shot"); if (b) open(+b.dataset.i); });
    lb.querySelector(".x").addEventListener("click", () => lb.close());
    lb.querySelector(".prev").addEventListener("click", () => open(idx - 1));
    lb.querySelector(".next").addEventListener("click", () => open(idx + 1));
    lb.addEventListener("click", e => { if (e.target === lb) lb.close(); });
    lb.addEventListener("keydown", e => { if (e.key === "ArrowLeft") open(idx - 1); if (e.key === "ArrowRight") open(idx + 1); });
    document.addEventListener("langchange", draw);
    draw();
  })();
</script>
</body>
</html>
